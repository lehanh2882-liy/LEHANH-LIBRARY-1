<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mục Lục Tài Liệu HTML</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f7f6;
      color: #2d3436;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      text-align: center;
      color: #0984e3;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      color: #636e72;
      margin-bottom: 30px;
      font-size: 15px;
    }
    #search-box {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 20px;
      border: 1px solid #dfe6e9;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
      outline: none;
    }
    #search-box:focus {
      border-color: #0984e3;
    }
    .file-list {
      list-style: none;
      padding: 0;
      display: grid;
      gap: 12px;
    }
    .file-item a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 16px 20px;
      border-radius: 10px;
      text-decoration: none;
      color: #2d3436;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .file-item a:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(9, 132, 227, 0.15);
      color: #0984e3;
    }
    .badge {
      background: #e1f0ff;
      color: #0984e3;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    #status {
      text-align: center;
      color: #636e72;
      padding: 20px;
    }
  </style>
</head>
<body>

  <h1>Danh Sách Trang HTML</h1>
  <p class="subtitle">Tự động cập nhật từ kho lưu trữ GitHub</p>

  <input type="text" id="search-box" placeholder="Gõ tên file để tìm kiếm nhanh...">
  <div id="status">Đang tải danh sách file...</div>
  <ul class="file-list" id="file-list"></ul>

  <script>
    // Tự động nhận diện tên tài khoản và tên kho lưu trữ từ đường dẫn GitHub Pages
    const hostParts = window.location.hostname.split('.');
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    
    const owner = hostParts[0]; // Tự động lấy username (ví dụ: lehanh2882-liy)
    const repo = pathParts[0];  // Tự động lấy tên kho lưu trữ

    const listEl = document.getElementById('file-list');
    const statusEl = document.getElementById('status');
    const searchBox = document.getElementById('search-box');
    let allHtmlFiles = [];

    async function loadFiles() {
      if (!owner || !repo) {
        statusEl.textContent = "Hãy mở trang này qua đường link GitHub Pages (https://tentaikhoan.github.io/ten-kho/) để danh sách tự động hiển thị.";
        return;
      }

      try {
        const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
        if (!response.ok) throw new Error("Không thể tải danh sách file");
        
        const files = await response.json();
        // Lọc lấy tất cả file .html và .htm, loại trừ chính file index.html
        allHtmlFiles = files.filter(file => 
          file.type === 'file' && 
          (file.name.endsWith('.html') || file.name.endsWith('.htm')) && 
          file.name.toLowerCase() !== 'index.html'
        );

        renderList(allHtmlFiles);
      } catch (err) {
        statusEl.textContent = "Lỗi khi tải danh sách: Hãy đảm bảo kho lưu trữ đang ở chế độ Public.";
      }
    }

    function renderList(files) {
      listEl.innerHTML = '';
      if (files.length === 0) {
        statusEl.textContent = "Chưa có file HTML nào khác trong thư mục này.";
        return;
      }
      statusEl.style.display = 'none';

      files.forEach(file => {
        const li = document.createElement('li');
        li.className = 'file-item';
        // Hiển thị tên đẹp hơn (bỏ đuôi .html)
        const displayName = file.name.replace(/\.html?$/i, '');
        li.innerHTML = `
          <a href="./${encodeURIComponent(file.name)}" target="_blank">
            <span>${displayName}</span>
            <span class="badge">Mở trang ↗</span>
          </a>
        `;
        listEl.appendChild(li);
      });
    }

    // Tính năng tìm kiếm nhanh
    searchBox.addEventListener('input', (e) => {
      const keyword = e.target.value.toLowerCase();
      const filtered = allHtmlFiles.filter(f => f.name.toLowerCase().includes(keyword));
      renderList(filtered);
      if (filtered.length === 0 && allHtmlFiles.length > 0) {
        statusEl.style.display = 'block';
        statusEl.textContent = "Không tìm thấy file phù hợp.";
      }
    });

    loadFiles();
  </script>

</body>
</html>
